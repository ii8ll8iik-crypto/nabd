<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" width="1120" height="390">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#0e1629"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1120" height="390" rx="18" fill="url(#bg2)" stroke="#1e293b" stroke-width="1.5"/>

  <text x="36" y="42" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800">
    WHY MULTI-HOP CONSTRUCTIVE PHYSICS?  (BUILDING vs. BREAKING)
  </text>
  <text x="36" y="65" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="12.5">
    Forecasting how a single newly created facility ripples across 4 graph hops — beyond what flat radius checks or LLMs can solve.
  </text>

  <!-- 4 Hops Cascade -->
  <g transform="translate(36, 95)">
    <rect x="0" y="0" width="235" height="160" rx="12" fill="#0a1f1c" stroke="#00e699" stroke-width="1.5"/>
    <text x="16" y="28" fill="#00e699" font-family="monospace" font-size="11.5" font-weight="700">HOP 1 · ACCESS & GRAVITY</text>
    <text x="16" y="54" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13.5" font-weight="700">Unlocking Real Demand</text>
    <text x="16" y="78" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11.5">Separates true unmet demand</text>
    <text x="16" y="96" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11.5">from mere redistribution along</text>
    <text x="16" y="114" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11.5">slope-adjusted walking streets.</text>
    <text x="16" y="142" fill="#34d399" font-family="monospace" font-size="10.5">Huff (1963) + E2SFCA (2009)</text>

    <line x1="235" y1="80" x2="267" y2="80" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="272" y="0" width="235" height="160" rx="12" fill="#1f180b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="288" y="28" fill="#fbbf24" font-family="monospace" font-size="11.5" font-weight="700">HOP 2 · COMPETITION</text>
    <text x="288" y="54" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13.5" font-weight="700">Cannibalization Ripple</text>
    <text x="288" y="78" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11.5">Traces exact visit losses on</text>
    <text x="288" y="96" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11.5">existing OSM competitors to</text>
    <text x="288" y="114" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11.5">expose saturated red oceans.</text>
    <text x="288" y="142" fill="#fcd34d" font-family="monospace" font-size="10.5">London Soho: 98.1% vs Irbid: 0%</text>

    <line x1="507" y1="80" x2="539" y2="80" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="544" y="0" width="235" height="160" rx="12" fill="#0d1b2f" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="560" y="28" fill="#22d3ee" font-family="monospace" font-size="11.5" font-weight="700">HOP 3 · SYNERGY</text>
    <text x="560" y="54" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13.5" font-weight="700">Induced Ecosystem Gaps</text>
    <text x="560" y="78" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11.5">Predicts secondary demand</text>
    <text x="560" y="96" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11.5">(e.g., clinic → pharmacy;</text>
    <text x="560" y="114" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11.5">campus → stationery & cafes).</text>
    <text x="560" y="142" fill="#67e8f9" font-family="monospace" font-size="10.5">Leontief Input-Output (1936)</text>

    <line x1="779" y1="80" x2="811" y2="80" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="816" y="0" width="232" height="160" rx="12" fill="#220e17" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="832" y="28" fill="#fb7185" font-family="monospace" font-size="11.5" font-weight="700">HOP 4 · CONGESTION</text>
    <text x="832" y="54" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13.5" font-weight="700">Capacity & Uncertainty</text>
    <text x="832" y="78" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11.5">Flags non-linear street & queue</text>
    <text x="832" y="96" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11.5">overload, then stress-tests via</text>
    <text x="832" y="114" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11.5">200 stochastic Monte Carlo runs.</text>
    <text x="832" y="142" fill="#fda4af" font-family="monospace" font-size="10.5">BPR (1964) + Monte Carlo</text>
  </g>

  <!-- Epistemic Humility Footer Bar -->
  <rect x="36" y="282" width="1048" height="82" rx="12" fill="#111827" stroke="#a855f7" stroke-opacity="0.55"/>
  <text x="56" y="309" fill="#e9d5ff" font-family="Inter, sans-serif" font-size="13.5" font-weight="700">
    Epistemic Humility Principle: Physics Augments Local Wisdom — Never Replaces It
  </text>
  <text x="56" y="332" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12">
    OpenStreetMap cannot see unmapped student dorms, local street culture, or new micro-niches. Nabd pairs strict mathematical bounds
  </text>
  <text x="56" y="350" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12">
    (P10–P90 envelopes) with the Participatory Reality Brush & Universal Facility DNA so people who know the ground co-author the model.
  </text>
</svg>
