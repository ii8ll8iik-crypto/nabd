<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 376" width="1100" height="376"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#050814" /><stop offset="100%" stop-color="#0d1528" /></linearGradient><marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#22d3ee" /></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#00e699" /></marker><marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" /></marker></defs><rect width="1100" height="376" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" /><text x="32" y="40" fill="#f8fafc" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700">WHY MULTI-HOP CONSTRUCTIVE PHYSICS? (BUILDING vs. BREAKING)</text><text x="32" y="63" fill="#94a3b8" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">Forecasting how a single newly created facility ripples across 4 graph hops beyond flat radius checks or LLMs.</text><rect x="32" y="88" width="232" height="156" rx="10" fill="#0a1f1c" stroke="#00e699" stroke-width="1.5" /><text x="46" y="114" fill="#00e699" font-family="monospace" font-size="11" font-weight="700">HOP 1: ACCESS &amp; GRAVITY</text><text x="46" y="140" fill="#f8fafc" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700">Unlocking Real Demand</text><text x="46" y="164" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="11">Separates true unmet demand</text><text x="46" y="182" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="11">from redistribution along real</text><text x="46" y="200" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="11">slope-adjusted street graphs.</text><text x="46" y="226" fill="#34d399" font-family="monospace" font-size="10">Huff (1963) + E2SFCA (2009)</text><line x1="264" y1="166" x2="294" y2="166" stroke="#22d3ee" stroke-width="2" marker-end="url(#ac)" /><rect x="300" y="88" width="232" height="156" rx="10" fill="#1f180b" stroke="#f59e0b" stroke-width="1.5" /><text x="314" y="114" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="700">HOP 2: COMPETITION</text><text x="314" y="140" fill="#f8fafc" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700">Cannibalization Ripple</text><text x="314" y="164" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="11">Traces exact visit losses on</text><text x="314" y="182" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="11">existing OSM competitors to</text><text x="314" y="200" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="11">expose saturated red oceans.</text><text x="314" y="226" fill="#fcd34d" font-family="monospace" font-size="10">Soho: 98.1% vs Irbid: 0.0%</text><line x1="532" y1="166" x2="562" y2="166" stroke="#22d3ee" stroke-width="2" marker-end="url(#ac)" /><rect x="568" y="88" width="232" height="156" rx="10" fill="#0d1b2f" stroke="#22d3ee" stroke-width="1.5" /><text x="582" y="114" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="700">HOP 3: SYNERGY</text><text x="582" y="140" fill="#f8fafc" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700">Induced Ecosystem Gaps</text><text x="582" y="164" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="11">Predicts secondary demand</text><text x="582" y="182" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="11">(clinic -&gt; pharmacy; campus</text><text x="582" y="200" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="11">-&gt; stationery &amp; cafes).</text><text x="582" y="226" fill="#67e8f9" font-family="monospace" font-size="10">Leontief Input-Output (1936)</text><line x1="800" y1="166" x2="830" y2="166" stroke="#22d3ee" stroke-width="2" marker-end="url(#ac)" /><rect x="836" y="88" width="232" height="156" rx="10" fill="#220e17" stroke="#f43f5e" stroke-width="1.5" /><text x="850" y="114" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="700">HOP 4: CONGESTION</text><text x="850" y="140" fill="#f8fafc" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700">Capacity &amp; Uncertainty</text><text x="850" y="164" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="11">Flags non-linear street/queue</text><text x="850" y="182" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="11">overload, then stress-tests in</text><text x="850" y="200" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="11">200 stochastic Monte Carlo runs.</text><text x="850" y="226" fill="#fda4af" font-family="monospace" font-size="10">BPR (1964) + Monte Carlo</text><rect x="32" y="268" width="1036" height="82" rx="10" fill="#111827" stroke="#a855f7" stroke-width="1.2" /><text x="50" y="294" fill="#e9d5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700">Epistemic Humility Principle: Physics Augments Local Wisdom - Never Replaces It</text><text x="50" y="316" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5">OpenStreetMap cannot see unmapped student dorms or local street culture. Nabd pairs strict mathematical bounds</text><text x="50" y="334" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5">(P10-P90 envelopes) with the Participatory Reality Brush &amp; Universal Facility DNA so locals co-author the model.</text></svg>